<title>Casa Bilingvă</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Concepto: un camino por Rumanía (Bucarest → Constanța), azul de Voroneț y bandas de punto de cruz de la «ie» */
:root{
  --bg:#F4F2EA; --surface:#FFFFFF; --ink:#101C45; --muted:#56607F; --line:#D8DCE8;
  --blue:#002B7F; --blue-soft:#DDE4F6; --red:#CE1126; --red-soft:#FADCE0; --gold:#9A7400; --gold-soft:#FFF3C4; --yellow:#FCD116;
  --wash-b:#E1E8F8; --wash-y:#FFF6D2; --wash-r:#FBE3E6;
  --sky1:#8FAFEA; --sky2:#EAF0FB; --mtn1:#6E86BE; --hill:#4E8A5A; --fir:#2C5C38; --wall:#F4EFE4;
  --ok:#1E8C57; --ok-soft:#DCF2E5; --bad:#CE1126; --bad-soft:#FADCE0;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08102E; --surface:#121B45; --ink:#EAEEFA; --muted:#9FAAD0; --line:#27336A;
  --blue:#7A9CFF; --blue-soft:#1C2A68; --red:#FF5D70; --red-soft:#3F1626; --gold:#FCD116; --gold-soft:#36300F; --yellow:#FCD116;
  --wash-b:#0B1A50; --wash-y:#1B1A12; --wash-r:#2A0F1E;
  --sky1:#0A1440; --sky2:#26357A; --mtn1:#27387A; --hill:#1D4029; --fir:#12301C; --wall:#CFC8B8;
  --ok:#4CD496; --ok-soft:#123A2C; --bad:#FF5D70; --bad-soft:#3F1626; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08102E; --surface:#121B45; --ink:#EAEEFA; --muted:#9FAAD0; --line:#27336A;
  --blue:#7A9CFF; --blue-soft:#1C2A68; --red:#FF5D70; --red-soft:#3F1626; --gold:#FCD116; --gold-soft:#36300F; --yellow:#FCD116;
  --wash-b:#0B1A50; --wash-y:#1B1A12; --wash-r:#2A0F1E;
  --sky1:#0A1440; --sky2:#26357A; --mtn1:#27387A; --hill:#1D4029; --fir:#12301C; --wall:#CFC8B8;
  --ok:#4CD496; --ok-soft:#123A2C; --bad:#FF5D70; --bad-soft:#3F1626; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg) linear-gradient(90deg,var(--wash-b) 0 33.34%,var(--wash-y) 33.34% 66.67%,var(--wash-r) 66.67%) fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.stitch{height:10px;background:
  conic-gradient(from 45deg at 50% 50%, var(--red) 0 25%, transparent 0 50%, var(--red) 0 75%, transparent 0) 0 0/10px 10px;opacity:.85}
.stitch.ink{background:conic-gradient(from 45deg at 50% 50%, var(--blue) 0 25%, transparent 0 50%, var(--blue) 0 75%, transparent 0) 0 0/10px 10px}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg) linear-gradient(90deg,var(--wash-b) 0 33.34%,var(--wash-y) 33.34% 66.67%,var(--wash-r) 66.67%) fixed}
.tricolor{height:8px;background:linear-gradient(90deg,#002B7F 0 33.34%,#FCD116 33.34% 66.67%,#CE1126 66.67%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--blue);margin-right:auto;letter-spacing:-.01em}
.brand span{color:var(--red)}
.brand i{font-style:normal;color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.chip.fire{color:var(--red)} .chip.xp{color:var(--gold)}
.chip.off{color:var(--muted)}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:800;font-size:16px;background:var(--blue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn.red{background:var(--red);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#000)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
:root:not([data-theme="light"]) .btn{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#0A1130}}
:root[data-theme="dark"] .btn:not(.ghost){color:#0A1130}

/* meta del día */
.goal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;line-height:1}
.ring b{font-size:24px} .ring small{font-size:11px;color:var(--muted);font-family:var(--body)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .5s}
.bar.blue>i{background:var(--blue)}
.lvl{font-family:var(--display);font-weight:800;font-size:20px}
.phrase{background:var(--blue);color:#fff;border:0;position:relative;overflow:hidden}
.phrase .ro{font-family:var(--display);font-size:24px;font-weight:700}
.phrase .es{opacity:.85}
.phrase .label{color:rgba(255,255,255,.75)}
.phrase .speak{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.18);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .phrase{background:var(--blue-soft)}}
:root[data-theme="dark"] .phrase{background:var(--blue-soft)}

/* ruta */
.route{position:relative;display:flex;flex-direction:column;gap:22px;padding:8px 0 4px}
.route::before{content:"";position:absolute;left:50%;top:30px;bottom:30px;border-left:4px dashed var(--line);transform:translateX(-2px)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;text-align:center}
.node:nth-child(odd){align-self:flex-start;margin-left:8%}
.node:nth-child(even){align-self:flex-end;margin-right:8%}
.disc{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--blue);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--blue) 55%,#000);border:4px solid var(--surface);transition:transform .1s}
.node button:active .disc{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.node.done .disc{background:#FCD116;box-shadow:0 6px 0 #B89400}
.node.lock .disc{background:var(--line);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000)}
.node.next .disc{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node .city{font-family:var(--display);font-weight:800;font-size:17px;line-height:1}
.node .ut{font-size:13px;color:var(--muted);line-height:1.2}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.stars .e{color:var(--line)}
.node > button{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;padding:4px;border-radius:12px}
.future{opacity:.8;border-style:dashed}

/* tabs inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted)}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-current="true"]{color:var(--blue)}

/* hoja / modal */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
.sheet .wrap{padding-bottom:40px}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:26px;line-height:1}
.speak{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.speak svg{width:22px;height:22px}
.vocab{display:grid;grid-template-columns:1fr;gap:0}
.vocab div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vocab div:last-child{border-bottom:0}
.vocab b{font-weight:800}
table.mini{border-collapse:collapse;margin:6px 0;font-size:15px;width:100%}
table.mini td,table.mini th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.mini th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}
.theory h2{font-size:26px;color:var(--blue)}
.theory .body{font-size:17px}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.ex-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:800}
.reto{background:var(--gold-soft);border-color:transparent}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--gold);display:grid;place-items:center;font-weight:800;flex:none}
.check.on{background:var(--gold);color:#fff}

/* ejercicio */
.qhead{display:flex;align-items:center;gap:10px;padding-block:6px}
.qhead .bar{flex:1}
.hearts{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{font-family:var(--display);font-size:24px;font-weight:700}
.kind{font-size:13px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.08em}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);box-shadow:0 3px 0 var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue);padding:0 4px}
.answer-line{min-height:60px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tile{padding:9px 13px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pairs .opt{text-align:center;padding:12px 8px;font-size:16px}
.pairs .opt.gone{opacity:.35;pointer-events:none;border-color:var(--ok);box-shadow:none}
.pairs .opt.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
textarea.write{width:100%;min-height:96px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;padding:12px;resize:none}
.dia{display:flex;gap:8px;flex-wrap:wrap}
.dia button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:19px;box-shadow:0 3px 0 var(--line)}
.bigspeak{display:flex;gap:12px;justify-content:center}
.bigspeak button{width:96px;height:96px;border-radius:24px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.bigspeak button.slow{width:64px;height:64px;align-self:end;background:var(--blue-soft);color:var(--blue);box-shadow:0 4px 0 var(--line);font-size:13px;font-weight:800}
.bigspeak svg{width:44px;height:44px}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid;animation:up .2s ease-out}
.feedback .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.feedback.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.feedback h3{font-size:24px}
.feedback .sol{color:var(--ink);font-weight:700}
.feedback .exp{color:var(--ink);font-size:15px}
@keyframes up{from{transform:translateY(100%)}}
.footer-action{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.footer-action .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.footer-action .btn{flex:1}

/* tarjetas de vocabulario */
.flash{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer}
.flash .front{font-family:var(--display);font-size:32px;font-weight:800}
.flash .back{font-family:var(--display);font-size:28px;color:var(--blue);font-weight:800}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.boxes div{background:var(--blue-soft);border-radius:10px;padding:8px 2px;font-weight:800;font-variant-numeric:tabular-nums}
.boxes small{display:block;font-size:11px;color:var(--muted);font-weight:700}

/* logros */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ach .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--gold-soft)}
.ach.lockd{opacity:.5}
.ach.lockd .ic{background:var(--line);filter:grayscale(1)}
.ach h3{font-size:17px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted);font-weight:700}
.week i{display:block;width:100%;max-width:28px;background:var(--blue);border-radius:6px 6px 2px 2px;min-height:3px}
.week .today i{background:var(--red)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;display:flex;gap:10px;align-items:center;max-width:92vw;animation:drop .3s ease-out}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--display);font-size:56px;font-weight:800;color:var(--gold);line-height:1}
textarea.code{width:100%;min-height:80px;font-family:ui-monospace,monospace;font-size:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="top"><div class="topbar">
  <div class="brand">Casa <span>Bilingvă</span></div>
  <span class="chip fire" id="hStreak" title="Racha de días">🔥 0</span>
  <span class="chip xp" id="hXp" title="Experiencia total">⭐ 0</span>
</div><div class="tricolor"></div></div>
<main class="wrap" id="view"></main>
<div class="tabs"><nav id="tabs"></nav></div>
<div id="layer"></div>
<canvas id="confetti" hidden></canvas>
<style>
/* reparto, chat, plan del día */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;flex:none;background:var(--blue)}
.av.rux{background:var(--red)} .av.gab{background:var(--gold)} .av.mar{background:var(--blue)} .av.me{background:var(--ok)}
.av.lg{width:64px;height:64px;font-size:28px}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cast .card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px}
.cast b{font-family:var(--display);font-size:17px;line-height:1}
.meter{width:100%;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .6s}
.plan{display:flex;flex-direction:column;gap:2px}
.plan button{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.plan button:last-child{border-bottom:0}
.plan .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;color:#fff}
.plan .on .tick{background:var(--ok);border-color:var(--ok)}
.plan .on .pt{text-decoration:line-through;color:var(--muted)}
.plan .pt{font-weight:800;display:block}
.plan .ps{font-size:13px;color:var(--muted);display:block}
.plan .go{margin-left:auto;color:var(--muted);font-size:20px}
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:150px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:17px;min-width:0;overflow-wrap:anywhere}
.msg.npc .bubble{border-bottom-left-radius:6px}
.msg.me .bubble{background:var(--blue);color:#fff;border-color:transparent;border-bottom-right-radius:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.me .bubble{background:var(--blue-soft);color:var(--ink)}}
:root[data-theme="dark"] .msg.me .bubble{background:var(--blue-soft);color:var(--ink)}
.bubble .tr{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.bubble .tools{display:flex;gap:6px;margin-top:6px}
.bubble .tools button{font-size:13px;font-weight:800;color:var(--blue);padding:2px 0}
.fix{align-self:flex-end;max-width:88%;background:var(--gold-soft);border-radius:14px;padding:8px 12px;font-size:15px}
.fix b{color:var(--ink)}
.fix.okk{background:var(--ok-soft);color:var(--ok);font-weight:800}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.composer .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;min-height:48px;max-height:120px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;padding:10px 12px;resize:none}
.composer .send{width:52px;height:52px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.composer .dia button{width:38px;height:36px;font-size:17px}
.typing{color:var(--muted);font-style:italic;padding-left:52px}
.scene-goal{background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:15px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.item .grow{flex:1;min-width:0}
.item h3{font-size:18px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.wait{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.redo{background:var(--bad-soft);color:var(--bad)}
.pill.lock{background:var(--line)}
.rafa{background:var(--red);color:#fff;border:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rafa{background:var(--red-soft);color:var(--ink)}}
:root[data-theme="dark"] .rafa{background:var(--red-soft);color:var(--ink)}
.rafa .ro{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.rafa .label{color:inherit;opacity:.8}
.rafa .speak{background:rgba(255,255,255,.2);color:inherit}
.rafa .btn.ghost{background:transparent;color:inherit;border-color:currentColor;box-shadow:none}
.starpick{display:flex;gap:8px}
.starpick button{font-size:30px;color:var(--line)}
.starpick button.on{color:var(--gold)}
input.txt,textarea.txt{width:100%;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px}
textarea.txt{min-height:90px;resize:vertical}
.del{text-decoration:line-through;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px;text-align:left}
.rank{font-family:var(--display);font-weight:800;font-size:22px;color:var(--blue);line-height:1}
.hello{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.05}
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--sky2)}
.hero svg{display:block;width:100%;height:auto}
.hero .cap{position:absolute;left:14px;top:12px;right:14px}
.hero .cap .hello{color:var(--blue);text-shadow:0 1px 0 var(--sky2)}
.hero .cap .small{color:var(--ink);font-weight:700}
.obicei{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-left:6px solid var(--yellow)}
.obicei .em{font-size:44px;line-height:1}
.obicei b{font-family:var(--display);font-size:20px}
.land{font-size:12px;color:var(--muted);font-weight:700}
.emoji-row{display:flex;justify-content:space-around;font-size:28px;padding:4px 0}

  ],
  vocab:[['da','sí'],['nu','no'],['ce','qué'],['cine','quién'],['apă','agua'],['mâine','mañana'],['pâine','pan'],['țară','país'],['șase','seis'],['ochi','ojos'],['chiar','realmente'],['cer','cielo']],

    {h:'Tú y usted', b:'Con tu mujer y con amigos: <b>tu</b>. Con los suegros al principio, o con desconocidos: <b>dumneavoastră</b>, con el verbo en 2ª persona del plural.<br><i>Ce faci?</i> (¿qué tal?, a ti) → <i>Ce faceți?</i> (a usted).<br><i>Te rog</i> → <i>Vă rog</i> (por favor).', ro:['Ce faci?','Ce faceți?','Vă rog']},
    {h:'a fi (ser / estar)', b:'<table class="mini"><tr><td>eu</td><td>sunt</td><td>noi</td><td>suntem</td></tr><tr><td>tu</td><td>ești</td><td>voi</td><td>sunteți</td></tr><tr><td>el/ea</td><td>este (e)</td><td>ei/ele</td><td>sunt</td></tr></table>Un solo verbo para «ser» y «estar»: <i>Sunt spaniol</i> (soy español), <i>Sunt obosit</i> (estoy cansado).', ro:['Sunt spaniol','Sunt obosit']}

  vocab:[['Bună ziua','buenos días / tardes'],['Bună dimineața','buenos días (temprano)'],['Bună seara','buenas noches (al llegar)'],['Noapte bună','buenas noches (al dormir)'],['Salut','hola'],['La revedere','adiós'],['Pa','chao'],['Mulțumesc','gracias'],['Cu plăcere','de nada'],['Te rog','por favor (tú)'],['Vă rog','por favor (usted)'],['Scuze','perdón'],['Bine','bien'],['Ce faci?','¿qué tal?'],['Poftă bună!','¡buen provecho!'],['Noroc!','¡salud! (brindis)']],

    {h:'Números del 1 al 10', b:'unu, doi, trei, patru, cinci, șase, șapte, opt, nouă, zece.<br>El 1 y el 2 tienen género: <i>un băiat, doi băieți</i> / <i>o fată, două fete</i>.', ro:['unu','doi','trei','patru','cinci','șase','șapte','opt','nouă','zece']},

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return dstr(d); };
const dayDiff = (a,b) => Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const clean = s => String(s).toLowerCase().replace(/ş/g,'ș').replace(/ţ/g,'ț').replace(/[.,!?¿¡;:«»"“”()…]/g,' ').replace(/\s+/g,' ').trim();
function judge(input, answers){
  const c = clean(input); if(!c) return 'no';
  if(answers.some(a => clean(a)===c)) return 'exact';
  if(answers.some(a => fold(clean(a))===fold(c))) return 'loose';
  return 'no';
}

function lsGet(k){ try{ return localStorage.getItem('cb_'+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem('cb_'+k,v); }catch(e){} }

let saveT=null, saving=false, dirty=false;
function save(){
  P.updatedAt = Date.now(); lsSet('P', JSON.stringify(P));
  if(S.progRef && ROLE==='eu'){ dirty=true; clearTimeout(saveT); saveT=setTimeout(flush,1500); }
}
async function flush(){
  if(saving){ saveT=setTimeout(flush,800); return; }
  if(!dirty) return; dirty=false; saving=true;
  try{ await S.progRef.set({s:JSON.stringify(P), at:P.updatedAt}); }catch(e){ console.warn('save',e); }
  saving=false;
}

async function addDoc(col, o){
  o.at = Date.now();
  if(S.db){ try{ await S.db.collection(col).add(o); }catch(e){ toast('No se pudo guardar. Revisa la conexión.'); } }
  else { o.id='l'+Date.now()+Math.random().toString(36).slice(2,6); P.local[col].unshift(o); save(); afterChange(); }
}
async function updDoc(col, id, patch){

  else { const r=P.local[col].find(x=>x.id===id); if(r) Object.assign(r,patch); save(); afterChange(); }
}

/* ---------- progreso, XP, racha ---------- */
function dayRec(){ const d=today(); return P.days[d] || (P.days[d]={xp:0,min:0,done:{}}); }
function addXP(n){ if(ROLE!=='eu') return; P.xp+=n; dayRec().xp+=n; touchStreak(); checkAch(); save(); updHeader(); }
function touchStreak(){ const t=today(); if(P.last===t) return; P.streak = (P.last && dayDiff(P.last,t)===1) ? P.streak+1 : 1; P.last=t; P.best=Math.max(P.best,P.streak); }
function liveStreak(){ return (P.last && dayDiff(P.last,today())<=1) ? P.streak : 0; }
let lastAct=0;
function activity(){ const n=Date.now(); if(lastAct && ROLE==='eu'){ const r=dayRec(); r.min=(r.min||0)+Math.min(n-lastAct,60000)/60000; } lastAct=n; }
function markDone(k){ const r=dayRec(); r.done=r.done||{}; if(r.done[k]) return; r.done[k]=1; save();
  if(PLAN_KEYS.every(x=>r.done[x]) && !r.done.perfect){ r.done.perfect=1; addXP(30); unlock('zi'); confetti(); toast('🌟 ¡Zi perfectă! +30 XP'); } }
const PLAN_KEYS=['lec','scena','rafa','jurnal','voc'];
function rank(xp=P.xp){ let r=RANKS[0], nx=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){ r=RANKS[i]; nx=RANKS[i+1]||null; } } return {r, nx}; }
function unitIdx(id){ return UNITS.findIndex(u=>u.id===id); }
function unlocked(id){ const i=unitIdx(id); return i<=0 || !!(P.units[UNITS[i-1].id]?.done); }
function nextUnit(){ return UNITS.find(u=>!P.units[u.id]?.done && unlocked(u.id)) || null; }
function level(){ const n=UNITS.filter(u=>P.units[u.id]?.done).length; return n<=2?'A1 (beginner)':n<=6?'A1-A2 (elementary)':'A2-B1 (pre-intermediate)'; }
function unlock(id){ if(P.ach[id]) return; P.ach[id]=today(); const a=ACH.find(x=>x[0]===id); if(a) setTimeout(()=>toast(a[1]+' Logro: '+a[2]),600); save(); }
function checkAch(){
  if(Object.values(P.units).some(u=>u.done)) unlock('primul');
  if(P.streak>=3) unlock('s3'); if(P.streak>=7) unlock('s7'); if(P.streak>=30) unlock('s30');
  if(Object.values(P.units).some(u=>u.stars===3)) unlock('perfect');
  const sc=Object.values(P.scenes); if(sc.length) unlock('scena1'); if(sc.some(s=>s.best===3)) unlock('scena3');
  if(SCENES.every(s=>P.scenes[s.id])) unlock('scenele');
  if(P.rel.gab>=50 && P.rel.mar>=50) unlock('socri');
  if(P.diaryN>=5) unlock('jurnal5');
  if(Object.keys(P.credited).length>=5) unlock('rux5');
  if(P.rafaN>=10) unlock('rafa10');
  if(P.verbs.ok>=50) unlock('verbe50');
  if(Object.values(P.srs).filter(c=>c.b>=3).length>=50) unlock('vocab50');
  if(P.xp>=500) unlock('xp500'); if(P.xp>=2000) unlock('xp2000');
  if(UNITS.every(u=>P.units[u.id]?.done)) unlock('fase1');
}
function creditRetos(){
  if(ROLE!=='eu') return;
  let changed=false;
  for(const r of retos()){
    if(r.status==='ok' && !P.credited[r.id]){
      P.credited[r.id]=1; changed=true;
      const xp = r.kind==='vida' ? 30 : 15+10*(r.stars||1);
      P.rel.rux=Math.min(100,(P.rel.rux||0)+6+2*(r.stars||1));
      P.xp+=xp; dayRec().xp+=xp; touchStreak();
      toast('❤️ Ruxandra ha aprobado un reto · +'+xp+' XP');
    }
  }
  if(changed){ checkAch(); save(); updHeader(); }
}

/* ---------- voz y sonido ---------- */
let roVoice=null;
function findVoice(){ try{ const v=speechSynthesis.getVoices(); roVoice=v.find(x=>/^ro/i.test(x.lang))||null; }catch(e){} }
try{ speechSynthesis.onvoiceschanged=findVoice; findVoice(); }catch(e){}
function speak(t, slow){
  const txt=String(t).replace(/___/g,'…');
  const TTS = window.Capacitor?.Plugins?.TextToSpeech;
  if(TTS){ TTS.speak({text:txt, lang:'ro-RO', rate: slow?0.6:0.9}).catch(()=>{}); return; }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang='ro-RO'; if(roVoice) u.voice=roVoice; u.rate=slow?0.6:0.92; speechSynthesis.speak(u); }catch(e){}
}
let actx=null;
function beep(ok){
  if(!SND) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime;
    const notes = ok ? [660,880] : [220,180];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type= ok?'triangle':'sawtooth'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.11); g.gain.exponentialRampToValueAtTime(ok?0.18:0.08,t+i*0.11+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.11+0.16);
      o.connect(g).connect(actx.destination); o.start(t+i*0.11); o.stop(t+i*0.11+0.18); });
  }catch(e){}
}
document.addEventListener('click', e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); speak(b.dataset.say, b.dataset.slow==='1'); } }, true);
const spk = (t, cls='speak') => `<button class="${cls}" data-say="${esc(t)}" aria-label="Escuchar">${IC.spk}</button>`;

}

let pendingRender=false;
function softRender(){
  const a=document.activeElement;
  if(a && $('#view').contains(a) && /TEXTAREA|INPUT/.test(a.tagName) && a.value){ if(!pendingRender){ pendingRender=true; a.addEventListener('blur',()=>{pendingRender=false; render();},{once:true}); } return; }
  render();
}
function render(){
  if(!ROLE){ rolePicker(); return; }
  updHeader(); renderTabs();
  const V={azi:vAzi, drum:vDrum, familia:vFamilia, exersa:vExersa, eu:vEu, retos:vJRetos, diario:vJDiario, progreso:vJProgreso}[TAB];
  $('#view').innerHTML = V();
  bindView();
}

/* ---------- enlaces de eventos ---------- */
function bindView(){
  const V=$('#view');
  V.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.plan;
    if(k==='lec'){ const u=nextUnit()||UNITS[0]; openUnit(u.id); }
    else if(k==='scena'){ const s=SCENES.find(s=>unlocked(s.unit)&&!P.scenes[s.id]); s?startScene(s.id):startScene('free:rux'); }
    else if(k==='rafa'){ document.querySelector('.rafa')?.scrollIntoView({behavior:'smooth',block:'center'}); }
    else if(k==='jurnal') openJournal();
    else if(k==='voc') startVocab();
  });
  V.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openRetosEu());
  const rd=$('#rafaDone'); if(rd) rd.onclick=()=>{ P.rafa[today()]=1; P.rafaN++; addXP(5); markDone('rafa'); beep(true); render(); };
  V.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{ if(!unlocked(b.dataset.unit)){ toast('Completa la etapa anterior para desbloquearla'); return; } openUnit(b.dataset.unit); });
  V.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{ const s=SCENES.find(x=>x.id===b.dataset.scene); if(!unlocked(s.unit)){ toast('Se desbloquea al llegar a '+UNITS[unitIdx(s.unit)].city); return; } startScene(s.id); });
  V.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>startScene('free:'+b.dataset.free));
  const on=(id,f)=>{ const e=$(id); if(e) e.onclick=f; };
  on('#goVoc',startVocab); on('#goVerb',openVerbSetup); on('#goErr',()=>{ if(Object.keys(P.errs).length+P.myErrs.length) startErrors(); }); on('#goJurnal',openJournal);
  on('#sndT',()=>{ SND=!SND; lsSet('snd',SND?'1':'0'); render(); });
  on('#roleT',()=>{ ROLE=null; lsSet('role',''); render(); });
  on('#bkOut',async()=>{ const code=btoa(unescape(encodeURIComponent(JSON.stringify(P)))); const ta=$('#bk'); ta.value=code; try{ await navigator.clipboard.writeText(code); toast('Código copiado'); }catch(e){ ta.select(); toast('Código seleccionado: cópialo'); } });
  on('#bkIn',()=>{ try{ const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim())))); if(typeof o.xp!=='number') throw 0; P=Object.assign(DEF(),o); save(); toast('Progreso restaurado'); render(); }catch(e){ toast('Ese código no es válido'); } });
  // jueza
  V.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{ $('#newReto').value=b.dataset.idea; });
  on('#sendReto',async()=>{ const t=$('#newReto').value.trim(); if(!t){ toast('Escribe el reto primero'); return; } $('#newReto').value=''; await addDoc('retos',{kind:'rux',text:t,status:'pending'}); toast('Reto enviado'); });
  V.querySelectorAll('[data-grade]').forEach(card=>{
    let st=0; const id=card.dataset.grade;
    card.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ st=+b.dataset.st; card.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',+x.dataset.st<=st)); });
    card.querySelector('[data-approve]').onclick=()=>{ if(!st){ toast('Elige de 1 a 3 estrellas'); return; } updDoc('retos',id,{status:'ok',stars:st,comment:card.querySelector('[data-cm]').value.trim(),gradedAt:Date.now()}); toast('Aprobado ✓'); };
    card.querySelector('[data-redo]').onclick=()=>{ updDoc('retos',id,{status:'pending',comment:card.querySelector('[data-cm]').value.trim()||'Mai încearcă o dată!'}); toast('Le pides que lo repita'); };
  });
  V.querySelectorAll('[data-dia]').forEach(card=>{ const b=card.querySelector('[data-dsend]'); if(b) b.onclick=()=>{ const v=card.querySelector('[data-dcm]').value.trim(); if(v) updDoc('diario',card.dataset.dia,{comment:v}); }; });
}

function openUnit(id){
  const u=UNITS[unitIdx(id)], st=P.units[id], vida=retos().find(r=>r.kind==='vida'&&r.unit===id);
  const vs = vida ? (vida.status==='ok'?'<span class="pill ok">Aprobado por Ruxandra '+'★'.repeat(vida.stars||0)+'</span>':vida.status==='pending'?'<span class="pill redo">Ruxandra pide repetirlo</span>':'<span class="pill wait">Esperando a Ruxandra</span>') : '';
  const el=sheet(`<div class="wrap stack">
    <div class="row"><button class="x" data-close aria-label="Cerrar">×</button><span class="label" style="margin-left:auto">Etapa ${unitIdx(id)+1} · ${esc(u.city)}</span></div>
    <div class="card row" style="gap:14px"><span style="font-size:44px" aria-hidden="true">${LAND[id][0]}</span><div><div class="label">Postal desde ${esc(u.city)}</div><b>${esc(LAND[id][1])}</b></div></div>
    <div><h2 style="font-size:32px;color:var(--blue)">${esc(u.title)}</h2><div class="muted">${esc(u.sub)}</div>${st?.done?'<div style="margin-top:6px">'+stars(st.stars)+'</div>':''}</div>
    <div class="row"><button class="btn ghost" style="flex:1" data-th>Teoría</button><button class="btn" style="flex:1.4" data-go-ex>${st?.done?'Repetir lección':'Empezar lección'}</button></div>
    <div class="card reto stack" style="gap:8px"><div class="label">Reto en casa</div><div>${esc(u.reto)}</div>
      ${vida && vida.status!=='pending' ? vs : `<button class="btn ghost" data-vida>${vida?'Lo he vuelto a hacer':'Lo he hecho'} · que lo apruebe Ruxandra</button>${vida&&vida.comment?'<div class="small">Ruxandra: '+esc(vida.comment)+'</div>':''}`}</div>
    <div class="card"><div class="label">Vocabulario (${u.vocab.length})</div><div class="vocab">${u.vocab.map(([r,e])=>`<div>${spk(r)}<b>${esc(r)}</b><span class="muted" style="margin-left:auto;text-align:right">${esc(e)}</span></div>`).join('')}</div></div>
  </div>`);
  el.querySelector('[data-close]').onclick=closeSheet;
  el.querySelector('[data-th]').onclick=()=>openTheory(id,false);
  el.querySelector('[data-go-ex]').onclick=()=>{ if(!P.seen[id]) openTheory(id,true); else startUnit(id); };
  const v=el.querySelector('[data-vida]'); if(v) v.onclick=async()=>{ if(vida) await updDoc('retos',vida.id,{status:'answered',answer:'Lo he hecho'}); else await addDoc('retos',{kind:'vida',unit:id,text:u.reto,status:'answered',answer:'Lo he hecho'}); toast('Enviado a Ruxandra'); openUnit(id); };
}
function openTheory(id, thenEx){
  const u=UNITS[unitIdx(id)]; let i=0;
  const draw=()=>{ const c=u.theory[i];
    const el=sheet(`<div class="wrap stack theory">
      <div class="qhead"><button class="x" data-close aria-label="Cerrar">×</button><div class="bar blue"><i style="width:${(i+1)/u.theory.length*100}%"></i></div></div>
      <div class="label">${esc(u.city)} · teoría ${i+1}/${u.theory.length}</div><h2>${esc(c.h)}</h2>
      <div class="body tablewrap">${c.b}</div>
      <div class="examples">${c.ro.map(r=>`<button class="ex-chip" data-say="${esc(r)}">${IC.spk.replace('<svg','<svg width="18" height="18"')} ${esc(r)}</button>`).join('')}</div>
    </div><div class="footer-action"><div class="in">${i?'<button class="btn ghost" data-prev>Atrás</button>':''}<button class="btn" data-next>${i<u.theory.length-1?'Siguiente':thenEx?'Empezar ejercicios':'Entendido'}</button></div></div>`);
    el.querySelector('[data-close]').onclick=closeSheet;
    const pv=el.querySelector('[data-prev]'); if(pv) pv.onclick=()=>{ i--; draw(); };
    el.querySelector('[data-next]').onclick=()=>{ activity(); if(i<u.theory.length-1){ i++; draw(); } else { P.seen[id]=1; save(); thenEx?startUnit(id):openUnit(id); } };
  }; draw();
}
function startUnit(id){
  const u=UNITS[unitIdx(id)];
  runSession(u.ex.map((ex,i)=>({ex,key:id+':'+i})), {title:u.city, unit:id, onEnd:(res)=>{
    const acc=res.first/res.total, s=acc>=.95?3:acc>=.8?2:1, prev=P.units[id];
    P.units[id]={done:true, stars:Math.max(s,prev?.stars||0), best:Math.max(acc,prev?.best||0)};
    addXP(20); markDone('lec'); checkAch(); save();
    return {stars:s, bonus:20};
  }});
}

/* ---------- motor de ejercicios ---------- */
const PRAISE=[['Bravo!','¡Muy bien!'],['Excelent!','¡Excelente!'],['Foarte bine!','¡Muy bien!'],['Super!','¡Genial!'],['Perfect!','¡Perfecto!'],['Ai dreptate!','¡Tienes razón!']];
let SES=null;
function runSession(items, opts){
  SES={q:items.slice(), i:0, total:items.length, first:0, xp:0, retried:new Set(), opts, cur:null};
  drawQ();
}
function drawQ(){
  if(SES.i>=SES.q.length) return endSession();
  const it=SES.q[SES.i], ex=it.ex; SES.cur={ans:null, it};
  const kinds={mc:'Elige la respuesta',gap:'Completa la frase',listen:'Escucha y elige',pairs:'Une las parejas',build:'Ordena la frase',write:'Escribe en rumano',fix:'Corrige tu frase',verb:'Conjuga'};
  let body='';
  if(ex.t==='mc') body=`<div class="prompt">${esc(ex.q)}</div>${optsHTML(ex)}`;
  else if(ex.t==='gap') body=`<div class="row"><div class="prompt" id="gapq" style="flex:1">${esc(ex.q).replace('___','<span class="gap" id="gapv">&nbsp;</span>')}</div>${spk(ex.q.replace('___', ex.o[ex.a]))}</div><div class="muted">${esc(ex.tr||'')}</div>${optsHTML(ex)}`;
  else if(ex.t==='listen') body=`<div class="bigspeak"><button data-say="${esc(ex.ro)}" aria-label="Escuchar">${IC.spk}</button><button class="slow" data-say="${esc(ex.ro)}" data-slow="1">lento</button></div>${optsHTML(ex)}`;
  else if(ex.t==='pairs') body=pairsHTML(ex);
  else if(ex.t==='build'){ const w=tokens(ex.ro); SES.cur.bank=shuffle(w.concat(ex.extra||[])); SES.cur.line=[];
    body=`<div class="prompt">${esc(ex.es)}</div><div class="answer-line" id="aline"></div><div class="bank" id="bank">${SES.cur.bank.map((t,i)=>`<button class="tile" data-ti="${i}">${esc(t)}</button>`).join('')}</div>`; }
  else if(ex.t==='write'||ex.t==='fix'||ex.t==='verb'){
    const pr = ex.t==='write'?`<div class="prompt">${esc(ex.es)}</div>` : ex.t==='fix'?`<div class="muted small">Escribiste:</div><div class="prompt del">${esc(ex.wrong)}</div>${ex.note?`<div class="muted small">Pista: ${esc(ex.note)}</div>`:''}` : `<div class="prompt">${esc(ex.verb.inf)} <span class="muted" style="font-size:18px">(${esc(ex.verb.es)})</span></div><div class="row"><span class="pill" style="font-size:15px">${esc(PERS[ex.p])}</span><span class="pill wait" style="font-size:15px">${esc(ex.tl)}</span></div>`;
    body=`${pr}<textarea class="write" id="win" placeholder="Escribe aquí…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>${diaKeys('#win')}`; }
  const el=sheet(`<div class="wrap stack">
    <div class="qhead"><button class="x" data-close aria-label="Salir">×</button><div class="bar"><i style="width:${SES.i/SES.q.length*100}%"></i></div><span class="hearts">${SES.i+1}/${SES.q.length}</span></div>
    <div class="kind">${kinds[ex.t]}${SES.retried.has(SES.i)?' · repaso':''}</div>${body}<div style="height:90px"></div>
  </div>${ex.t==='pairs'?'':'<div class="footer-action"><div class="in"><button class="btn" id="chk" disabled>Comprobar</button></div></div>'}`);
  el.querySelector('[data-close]').onclick=()=>{ SES=null; closeSheet(); };
  bindQ(el, ex);
  if(ex.t==='listen') setTimeout(()=>speak(ex.ro),250);
}
const tokens = s => s.replace(/[.,!?¿¡;:«»]/g,'').split(/\s+/).filter(Boolean);
function optsHTML(ex){ const o=shuffle(ex.o.map((t,i)=>({t,i}))); return `<div class="opts">${o.map(x=>`<button class="opt" data-oi="${x.i}">${esc(x.t)}</button>`).join('')}</div>`; }

function bindPairs(el, ex){

    const bl=el.querySelector(`[data-pl="${selL}"]`), br=el.querySelector(`[data-pr="${selR}"]`);
    if(selL===selR){ bl.classList.remove('sel'); br.classList.remove('sel'); bl.classList.add('gone'); br.classList.add('gone'); speak(ex.p[selL][0]); left--; beep(true);
      if(!left) setTimeout(()=>feedback(miss?'no':'exact', miss?'Te equivocaste en alguna pareja. Repásalas:':'', ex.p.map(p=>p[0]+' = '+p[1]).join(' · ')),350); }
    else { miss++; [bl,br].forEach(b=>{ b.classList.add('shake','wrong'); setTimeout(()=>b.classList.remove('shake','wrong','sel'),400); }); beep(false); }
    selL=selR=null; };

}
function feedback(res, sol, sayText, looseAns){
  activity();
  const ok=res!=='no', it=SES.cur.it, ex=it.ex, firstTime=!SES.retried.has(SES.i);
  beep(ok);
  if(ok && firstTime){ SES.first++; const x = ex.t==='verb'?5:10; SES.xp+=x; }
  if(ex.t==='verb'){ P.verbs.n++; if(ok) P.verbs.ok++; }
  if(SES.opts.onItem) SES.opts.onItem(it, ok);
  if(!ok && it.key && !SES.opts.review){ P.errs[it.key]=0; }
  if(!ok && !SES.retried.has(SES.i) && !SES.opts.noRetry){ SES.q.push(it); SES.retried.add(SES.q.length-1); }
  save();
  const [pr,pe]=pick(PRAISE);
  const fb=document.createElement('div'); fb.className='feedback '+(ok?'good':'bad');
  fb.innerHTML=`<div class="in"><div class="row" style="justify-content:space-between"><h3>${ok?esc(pr):'Răspuns corect:'}</h3>${sayText?spk(sayText):''}</div>
    ${ok?`<div class="small">${esc(pe)}${res==='loose'?' · Ojo a los diacríticos: <b class="sol">'+esc(looseAns||sol)+'</b>':''}</div>`:`<div class="sol">${esc(sol)}</div>`}
    ${ex.ex?`<div class="exp">${esc(ex.ex)}</div>`:''}
    <button class="btn ${ok?'ok':'red'} block" id="cont">Continuar</button></div>`;
  document.querySelector('.sheet').appendChild(fb);
  const fa=document.querySelector('.footer-action'); if(fa) fa.remove();
  if(ok && sayText && ex.t!=='listen') speak(sayText);
  fb.querySelector('#cont').onclick=()=>{ SES.i++; drawQ(); };
  fb.querySelector('#cont').focus();
}
function endSession(){
  const s=SES; const r = s.opts.onEnd ? s.opts.onEnd({first:s.first,total:s.total}) : {};

/* ---------- vocabulario (repaso espaciado) ---------- */
const INT=[0,1,3,7,16,35];
function vocabPool(){
  const pool=[];
  UNITS.forEach(u=>{ if(unlocked(u.id) && (P.seen[u.id]||P.units[u.id])) u.vocab.forEach(([r,e])=>pool.push({id:r,ro:r,es:e,u:u.city})); });
  P.extra.forEach(([r,e])=>{ if(!pool.some(p=>p.id===r)) pool.push({id:r,ro:r,es:e,u:'Tu diario'}); });
  return pool;
}
function dueCards(){ const t=today(); return vocabPool().filter(c=>P.srs[c.id] && P.srs[c.id].due<=t); }
function startVocab(){
  const pool=vocabPool();
  if(!pool.length){ const u=UNITS[0]; toast('Primero abre la teoría de '+u.city+' para desbloquear sus palabras'); openUnit(u.id); return; }
  const due=shuffle(dueCards()), fresh=shuffle(pool.filter(c=>!P.srs[c.id])).slice(0,Math.max(0,8-Math.min(due.length,8)));
  let deck=due.slice(0,15).concat(fresh).slice(0,15); if(!deck.length) deck=shuffle(pool).slice(0,10);
  let i=0, known=0, again=new Set();
  const draw=()=>{
    if(i>=deck.length){ addXP(10+known*2); markDone('voc'); checkAch(); const el=sheet(`<div class="wrap stack result" style="padding-top:48px"><div class="label">Repaso terminado</div><div class="big">+${10+known*2} XP</div><div class="muted">${known} de ${deck.length} a la primera</div><button class="btn block" id="fin">Continuar</button></div>`); el.querySelector('#fin').onclick=closeSheet; if(known>=deck.length*0.8) confetti(); return; }
    const c=deck[i], dir=Math.random()<.5, front=dir?c.es:c.ro, back=dir?c.ro:c.es;
    const el=sheet(`<div class="wrap stack"><div class="qhead"><button class="x" data-close aria-label="Salir">×</button><div class="bar blue"><i style="width:${i/deck.length*100}%"></i></div><span class="hearts">${i+1}/${deck.length}</span></div>
      <div class="kind">${dir?'¿Cómo se dice en rumano?':'¿Qué significa?'} · ${esc(c.u)}</div>
      <button class="card flash" id="fl"><span class="front">${esc(front)}</span><span class="muted small" id="hint">Toca para ver la respuesta</span><span class="back" id="bk2" hidden>${esc(back)}</span></button>
      <div class="row" id="grade" hidden><button class="btn red" style="flex:1" data-g="0">No la sabía</button><button class="btn ok" style="flex:1" data-g="1">La sabía</button></div></div>`);
    el.querySelector('[data-close]').onclick=closeSheet;
    if(!dir) speak(c.ro);
    el.querySelector('#fl').onclick=()=>{ el.querySelector('#bk2').hidden=false; el.querySelector('#hint').hidden=true; el.querySelector('#grade').hidden=false; if(dir) speak(c.ro); };
    el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ activity(); const ok=b.dataset.g==='1', s=P.srs[c.id]||{b:0,due:today()};
      if(ok){ s.b=Math.min(5,s.b+1); s.due=addDays(today(),INT[s.b]); if(!again.has(c.id)) known++; beep(true); }
      else { s.b=1; s.due=today(); if(!again.has(c.id)){ again.add(c.id); deck.push(c); } beep(false); }
      P.srs[c.id]=s; save(); i++; draw(); });
  }; draw();
}

/* ---------- conjugación ---------- */
const TENSES={pr:'Presente',pc:'Pasado (perfect compus)',fu:'Futuro (voi + inf.)'};
let verbT=new Set(['pr']);
function openVerbSetup(){
  const el=sheet(`<div class="wrap stack"><div class="row"><button class="x" data-close aria-label="Cerrar">×</button><span class="label" style="margin-left:auto">Gimnasio de verbos</span></div>
    <h2 style="font-size:30px">Conjugación</h2><p class="muted" style="margin:0">10 formas al azar. Escribe solo el verbo (o con el pronombre, como prefieras).</p>
    <div class="label">Tiempos</div><div class="seg">${Object.entries(TENSES).map(([k,t])=>`<button data-t="${k}" aria-pressed="${verbT.has(k)}">${t}</button>`).join('')}</div>
    <button class="btn block" id="vgo">Empezar · 10 formas</button>
    <div class="card"><div class="label">Tabla de referencia</div><div class="tablewrap"><table class="mini"><tr><th>verbo</th><th>eu</th><th>el/ea</th><th>noi</th><th>participio</th></tr>${VERBS.map(v=>`<tr><td><b>${esc(v.inf)}</b><br><span class="muted small">${esc(v.es)}</span></td><td>${esc(v.pr[0])}</td><td>${esc(v.pr[2])}</td><td>${esc(v.pr[3])}</td><td>${esc(v.pp||'—')}</td></tr>`).join('')}</table></div></div></div>`);
  el.querySelector('[data-close]').onclick=closeSheet;
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const k=b.dataset.t; if(verbT.has(k)&&verbT.size>1) verbT.delete(k); else verbT.add(k); b.setAttribute('aria-pressed',verbT.has(k)); el.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',verbT.has(x.dataset.t))); });
  el.querySelector('#vgo').onclick=()=>{
    const items=[]; let guard=0;
    while(items.length<10 && guard++<200){ const v=pick(VERBS), t=pick([...verbT]), p=Math.floor(Math.random()*6);
      if(t!=='pr' && !v.pp) continue;
      const ans = t==='pr'?v.pr[p] : t==='pc'?AUX_PC[p]+' '+v.pp : AUX_FU[p]+' '+v.fu;
      items.push({ex:{t:'verb', verb:v, p, tl:TENSES[t].split(' (')[0], ans}}); }
    runSession(items,{title:'Conjugación', noRetry:false, onEnd:()=>{ checkAch(); return {}; }});
  };
}

/* ---------- mis errores ---------- */
function startErrors(){
  const items=[];
  Object.keys(P.errs).forEach(k=>{ const [u,i]=k.split(':'); const unit=UNITS[unitIdx(u)]; if(unit&&unit.ex[+i]) items.push({ex:unit.ex[+i], key:k, kind:'u'}); else delete P.errs[k]; });
  P.myErrs.forEach((e,j)=>items.push({ex:{t:'fix', wrong:e.wrong, right:e.right, note:e.note}, ref:e, kind:'m'}));
  const list=shuffle(items).slice(0,12);
  runSession(list,{title:'Mis errores', review:true, noRetry:true, onItem:(it,ok)=>{
    if(it.kind==='u'){ if(ok){ P.errs[it.key]=(P.errs[it.key]||0)+1; if(P.errs[it.key]>=2) delete P.errs[it.key]; } else P.errs[it.key]=0; }
    else { const e=it.ref; if(ok){ e.ok=(e.ok||0)+1; if(e.ok>=2) P.myErrs=P.myErrs.filter(x=>x!==e); } else e.ok=0; }
  }, onEnd:()=>({})});
}
function addMyErr(wrong, right, note){
  if(!wrong||!right||clean(wrong)===clean(right)) return;
  if(P.myErrs.some(e=>clean(e.right)===clean(right))) return;
  P.myErrs.push({wrong:String(wrong).slice(0,200), right:String(right).slice(0,200), note:note?String(note).slice(0,160):'', ok:0});
  if(P.myErrs.length>60) P.myErrs.shift();
}

/* ---------- IA: escenas ---------- */
function aiError(e){
  if(!S.sample) return 'Las escenas y el diario usan IA: abre la app desde Claude (en la app de tu móvil o en claude.ai) para usarlos.';
  const c=e&&e.code;
  if(c==='rate_limited') return 'Has llegado al límite de uso por ahora. Prueba un poco más tarde.';
  if(c==='not_granted') return 'Hace falta tu permiso para que la app use Claude. Vuelve a intentarlo y acepta.';
  return 'No he podido contestar. Vuelve a intentarlo.';
}

    if(!S.sample){ msgs.push({from:'sys',html:esc(aiError())}); draw(); return; }
    busy=true; draw();
    try{ const h=await S.sample.json(`A Spanish-speaking learner of Romanian (level ${level()}) is in this conversation and does not know what to answer. Scene goal: ${sc.goal}.\n${transcript()}\nSuggest ONE simple, natural answer he could give next. Return ONLY JSON: {"ro":"answer in Romanian with correct diacritics","es":"Spanish translation"}`,{modelTier:'quick'});
      msgs.push({from:'hint',ro:String(h.ro||''),es:String(h.es||'')}); }catch(e){ msgs.push({from:'sys',html:esc(aiError(e))}); }
    busy=false; draw();
  };
}

/* ---------- diario ---------- */
function openJournal(){
  const mine=diario().slice(0,15);
  const el=sheet(`<div class="wrap stack">
    <div class="row"><button class="x" data-close aria-label="Cerrar">×</button><span class="label" style="margin-left:auto">Jurnal</span></div>
    <h2 style="font-size:30px">Tu día en 3 frases</h2>
    <p class="muted" style="margin:0">Escribe en rumano qué has hecho hoy. Si no sabes una palabra, ponla en español: te la traduzco y la añado a tu vocabulario.</p>
    <textarea class="write" id="jin" placeholder="Azi am lucrat… Am mâncat… Seara am…" spellcheck="false"></textarea>${diaKeys('#jin')}
    <button class="btn red block" id="jgo">Corregir y guardar</button>
    <div id="jres"></div>
    ${mine.length?`<div class="label">Entradas anteriores</div>${mine.map(d=>`<div class="card stack" style="gap:6px"><div class="small muted">${esc(d.date)}</div><div class="del" style="color:var(--muted)">${esc(d.text)}</div><div style="color:var(--ok);font-weight:700">${esc(d.corrected||'')}</div>${d.comment?`<div class="fix"><b>Ruxandra:</b> ${esc(d.comment)}</div>`:''}</div>`).join('')}`:''}
  </div>`);
  el.querySelector('[data-close]').onclick=closeSheet; bindDia(el);
  const go=el.querySelector('#jgo'), out=el.querySelector('#jres');
  go.onclick=async()=>{
    const t=el.querySelector('#jin').value.trim(); if(t.length<8){ toast('Escribe al menos una frase'); return; }
    if(!S.sample){ out.innerHTML=`<div class="card small">${esc(aiError())}</div>`; return; }
    activity(); go.disabled=true; go.textContent='Corrigiendo…';
    try{
      const r=await S.sample.json(`You are a warm, precise Romanian teacher. The learner (Spanish speaker, level ${level()}) wrote this diary entry in Romanian about his day:\n"""${t}"""\nReturn ONLY JSON: {"corrected":"the whole text corrected into natural Romanian with correct diacritics, keeping his meaning and simple style","errors":[{"wrong":"his exact fragment","right":"corrected fragment","why_es":"very short explanation in Spanish"}],"praise_es":"one encouraging sentence in Spanish naming something concrete he did well","new_words":[["romanian word","spanish meaning"]],"score":2}\nRules: at most 6 errors, the most important ones. Parts written in Spanish: translate them in "corrected" and list them as errors with why_es "Así se dice en rumano". new_words: at most 3 useful words from the corrected text he probably does not know. score 1-3.`);
      const errs=Array.isArray(r.errors)?r.errors.slice(0,6):[];
      errs.forEach(e=>addMyErr(e.wrong,e.right,e.why_es));
      (Array.isArray(r.new_words)?r.new_words.slice(0,3):[]).forEach(w=>{ if(Array.isArray(w)&&w[0]&&!P.extra.some(x=>x[0]===w[0])) P.extra.push([String(w[0]),String(w[1]||'')]); });
      P.diaryN++; const xp=15+5*Math.max(1,Math.min(3,+r.score||1)); addXP(xp); markDone('jurnal'); checkAch(); save();
      await addDoc('diario',{date:today(), text:t, corrected:String(r.corrected||''), errors:errs});
      el.querySelector('#jin').value='';
      out.innerHTML=`<div class="card stack"><div class="row" style="justify-content:space-between"><div class="label">Corregido · +${xp} XP</div>${spk(String(r.corrected||''))}</div>
        <div style="color:var(--ok);font-weight:700;font-size:18px">${esc(r.corrected||'')}</div>
        ${errs.map(e=>`<div class="fix"><span class="del">${esc(e.wrong)}</span> → <b>${esc(e.right)}</b><br><span class="small">${esc(e.why_es||'')}</span></div>`).join('')}
        ${r.praise_es?`<div class="fix okk">${esc(r.praise_es)}</div>`:''}
        ${Array.isArray(r.new_words)&&r.new_words.length?`<div class="small muted">Añadidas a tu vocabulario: ${r.new_words.slice(0,3).map(w=>esc(w[0])).join(', ')}</div>`:''}
        <div class="small muted">Ruxandra puede leerlo y dejarte un comentario.</div></div>`;
      if(errs.length<=1) confetti();
    }catch(e){ out.innerHTML=`<div class="card small">${esc(aiError(e))}</div>`; }
    go.disabled=false; go.textContent='Corregir y guardar';
  };
}

/* ---------- confeti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'); cv.hidden=false; const x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement); const cols=['--red','--blue','--gold','--ok'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:5+Math.random()*6,r:Math.random()*6,c:pick(cols)}));
  let f=0; const tick=()=>{ x.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); });
    if(++f<150) requestAnimationFrame(tick); else { x.clearRect(0,0,cv.width,cv.height); cv.hidden=true; } }; tick();
}

/* ---------- arranque ---------- */
async function boot(){
  loadLocal();
  const h=(location.hash||'').slice(1).toLowerCase();
  if(h==='ruxandra'){ ROLE='rux'; lsSet('role','rux'); TAB='retos'; } else if(h==='jose'){ ROLE='eu'; lsSet('role','eu'); TAB='azi'; }
  render();
  if(!(window.claude && typeof window.claude.use==='function')) return;
  try{
    const [db, sample] = await Promise.all([claude.use('db').catch(()=>null), claude.use('sample').catch(()=>null)]);
    S.sample=sample;
    if(db){
      S.db=db; S.online=true; S.progRef=db.doc('casa/progress');
      S.progRef.onSnapshot(snap=>{
        if(!snap.exists){ if(ROLE==='eu' && P.updatedAt){ dirty=true; flush(); } return; }
        const d=snap.data(); if(d && d.at>P.updatedAt){ try{ const np=Object.assign(DEF(),JSON.parse(d.s)); np.updatedAt=d.at; P=np; lsSet('P',d.s); }catch(e){} if(!SES) softRender(); }
      }, e=>console.warn(e));
      db.collection('retos').orderBy('at','desc').limit(200).onSnapshot(q=>{ S.retos=q.docs.map(x=>({id:x.id,...x.data()})); creditRetos(); if(!SES) softRender(); }, e=>console.warn(e));
      db.collection('diario').orderBy('at','desc').limit(200).onSnapshot(q=>{ S.diario=q.docs.map(x=>({id:x.id,...x.data()})); if(!SES) softRender(); }, e=>console.warn(e));
    }
  }catch(e){ console.warn(e); }
  if(!SES && !$('#layer').innerHTML) render();
}
boot();
