name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar las dos APK
        run: gradle assembleDebug --no-daemon

      - name: Renombrar
        run: |
          mkdir out
          cp app/build/outputs/apk/jose/debug/app-jose-debug.apk out/CasaBilingva-JoseAntonio.apk
          cp app/build/outputs/apk/ruxandra/debug/app-ruxandra-debug.apk out/CasaBilingva-Ruxandra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: casa-bilingva-apk
          path: out/*.apk

      - name: Publicar versión para descargar desde el móvil
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Casa Bilingvă ${{ github.run_number }}
          body: Descarga la APK con tu nombre e instálala en tu Android.
          files: out/*.apk
